<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON RUSH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0014; }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'Arial Black', 'Avenir Next', 'Helvetica Neue', sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #score {
    position: absolute; top: 4%; left: 50%; transform: translateX(-50%);
    font-style: italic; font-weight: 900; font-size: clamp(44px, 9vw, 72px);
    letter-spacing: 2px; line-height: 1;
    background: linear-gradient(180deg, #fff6a9 0%, #ffd319 35%, #ff5fa0 75%, #ff2975 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 60, 150, .85)) drop-shadow(0 2px 0 rgba(120, 0, 60, .9));
  }

  #combo {
    position: absolute; top: calc(4% + clamp(48px, 9.5vw, 78px)); left: 50%; transform: translateX(-50%);
    font-style: italic; font-weight: 900; font-size: clamp(16px, 3vw, 22px);
    letter-spacing: 3px; color: #ff9de2;
    text-shadow: 0 0 10px rgba(255, 80, 200, .9), 0 0 24px rgba(255, 40, 160, .6);
    opacity: 0; transition: opacity .25s;
  }
  #combo.on { opacity: 1; }

  #dist {
    position: absolute; top: 4.5%; right: 5%;
    font-weight: 800; font-style: italic; font-size: clamp(15px, 2.6vw, 20px);
    color: #d8f6ff; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(90, 220, 255, .9);
  }

  .popup {
    position: absolute; transform: translate(-50%, -50%);
    font-style: italic; font-weight: 900; font-size: clamp(26px, 5.5vw, 38px);
    letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(180deg, #fffbe0 0%, #ffd319 50%, #ff8a00 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 200, 40, .95));
    animation: pop .95s cubic-bezier(.17, .89, .32, 1.27) forwards;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
    18%  { opacity: 1; transform: translate(-50%, -54%) scale(1.25) rotate(2deg); }
    35%  { transform: translate(-50%, -58%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -150%) scale(.9); }
  }

  #flash {
    position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 30, 60, .55) 100%);
    opacity: 0; transition: opacity .1s;
  }

  #lives {
    position: absolute; top: 4.5%; left: 5%;
    font-size: clamp(18px, 3.4vw, 26px); letter-spacing: 4px; color: #ff4f9e;
    text-shadow: 0 0 10px rgba(255, 60, 150, .95), 0 0 22px rgba(255, 30, 120, .6);
  }
  #lives .off { opacity: .22; text-shadow: none; }

  #gameover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(ellipse at center, rgba(50, 0, 35, .5) 0%, rgba(8, 0, 18, .88) 100%);
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  #gameover.on { opacity: 1; }
  #gameover .go-title {
    font-style: italic; font-weight: 900; font-size: clamp(42px, 9.5vw, 70px); letter-spacing: 5px;
    background: linear-gradient(180deg, #ffe0ec 0%, #ff2975 55%, #c1004a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 40, 110, .9));
  }
  #gameover .go-score {
    font-style: italic; font-weight: 900; font-size: clamp(34px, 7.5vw, 54px); letter-spacing: 2px;
    background: linear-gradient(180deg, #fff6a9 0%, #ffd319 45%, #ff8a00 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 190, 40, .85));
  }
  #gameover .go-dist {
    font-weight: 800; font-style: italic; font-size: clamp(15px, 3vw, 20px); letter-spacing: 2px;
    color: #9af2ff; text-shadow: 0 0 10px rgba(60, 210, 255, .9);
  }
  #gameover .go-retry {
    margin-top: 22px; font-weight: 700; font-size: clamp(13px, 2.6vw, 16px); letter-spacing: 3px;
    color: rgba(235, 242, 255, .9); text-shadow: 0 0 8px rgba(120, 80, 255, .85);
    animation: blink 1.4s ease-in-out infinite;
  }

  #start {
    position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
    text-align: center; transition: opacity .6s;
  }
  #start .title {
    font-style: italic; font-weight: 900; font-size: clamp(34px, 7vw, 56px); letter-spacing: 4px;
    background: linear-gradient(180deg, #9af7ff 0%, #18e7ff 45%, #ff2bd6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(40, 200, 255, .8));
  }
  #start .keys {
    margin-top: 10px; font-weight: 700; font-size: clamp(12px, 2.4vw, 15px); letter-spacing: 2px;
    color: rgba(230, 240, 255, .85); text-shadow: 0 0 8px rgba(120, 80, 255, .8);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  #start.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="hud">
  <div id="score">0</div>
  <div id="combo">COMBO ×2</div>
  <div id="dist">0m</div>
  <div id="lives"></div>
  <div id="popups"></div>
  <div id="flash"></div>
  <div id="gameover">
    <div class="go-title">GAME OVER</div>
    <div class="go-score" id="go-score">0</div>
    <div class="go-dist" id="go-dist">0m</div>
    <div class="go-retry">PRESS ANY KEY / TAP TO RETRY</div>
  </div>
  <div id="start">
    <div class="title">NEON RUSH</div>
    <div class="keys">← → MOVE&nbsp;&nbsp;/&nbsp;&nbsp;SPACE JUMP&nbsp;&nbsp;—&nbsp;&nbsp;DEMO PLAYING</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
